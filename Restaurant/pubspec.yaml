name: ecd_restaurant
description: A new Flutter project for Restaurant App.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  socket_io_client: ^3.1.4
  shared_preferences: ^2.5.5
  audioplayers: ^6.7.1
  image_picker: ^1.2.3
  google_fonts: ^6.1.0
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "web/icons/logo.png"

flutter:
  uses-material-design: true
  assets:
    - splash_logo.png
    - assets/audio/
