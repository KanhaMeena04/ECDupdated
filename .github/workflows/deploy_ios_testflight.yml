name: Build & Deploy iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - user
          - restaurant
          - rider
      upload_testflight:
        description: 'Upload directly to App Store Connect / TestFlight?'
        required: true
        default: false
        type: boolean

jobs:
  build-user:
    name: Build User iOS (ECDKART)
    runs-on: macos-14
    if: inputs.app == 'all' || inputs.app == 'user'
    defaults:
      run:
        working-directory: User
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.USER_IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'buildpassword123' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
              echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
            fi

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH

            if [ -f "$PP_PATH" ]; then
              mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
              cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
            fi
          else
            echo "Signing secrets not present in repo secrets; building unsigned / debug archive."
          fi

      - name: Setup GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST: ${{ secrets.USER_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_PLIST" ]; then
            echo "$GOOGLE_SERVICE_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build User iOS IPA
        run: |
          if [ -n "${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}" ]; then
            flutter build ipa --release
          else
            flutter build ios --release --no-codesign
          fi

      - name: Upload User IPA / Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-ios-release
          path: |
            User/build/ios/ipa/*.ipa
            User/build/ios/iphoneos/Runner.app

      - name: Upload to TestFlight
        if: inputs.upload_testflight == true && env.API_KEY_ID != ''
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -f "$IPA_PATH" ]; then
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
          else
            echo "No IPA found to upload."
          fi

