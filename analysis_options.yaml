analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/build/**"
    - "**/android/**"
    - "**/ios/**"
    - "**/web/**"
    - "**/windows/**"
    - "**/macos/**"
    - "**/linux/**"
  errors:
    deprecated_member_use: ignore
    unused_import: ignore
    unused_element: ignore
    unused_local_variable: ignore
    unused_field: ignore
    unused_shown_name: ignore
    undefined_hidden_name: ignore
    avoid_print: ignore
    use_build_context_synchronously: ignore
    dead_code: ignore
    prefer_final_fields: ignore
    use_super_parameters: ignore
    library_prefixes: ignore
    use_rethrow_when_possible: ignore
    unnecessary_const: ignore
    unnecessary_string_interpolations: ignore
    unnecessary_brace_in_string_interps: ignore
    unnecessary_to_list_in_spreads: ignore
    unnecessary_nullable_for_final_variable_declarations: ignore
    unnecessary_import: ignore
    prefer_null_aware_operators: ignore
    prefer_interpolation_to_compose_strings: ignore
    sort_child_properties_last: ignore
    depend_on_referenced_packages: ignore
    todo: ignore
    unused_element_parameter: ignore
    prefer_conditional_assignment: ignore
    unnecessary_null_comparison: ignore

linter:
  rules:
    avoid_print: false
    prefer_single_quotes: false
