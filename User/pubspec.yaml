name: ecdkart_app
description: "ECDKART Food Delivery App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^14.6.2

  google_maps_flutter: ^2.5.3
  latlong2: ^0.9.1
  geolocator: ^11.0.0

  # UI
  cupertino_icons: ^1.0.8

  # Local Storage
  shared_preferences: ^2.2.3

  # Slider
  carousel_slider: ^5.0.0

  # Brand Icons
  font_awesome_flutter: ^11.0.0

  

  # Payment
  razorpay_flutter: ^1.3.15

  # HTTP Client
  http: ^1.6.0

  # Menu Button
  popover: ^0.3.0

  # OTP Field
  flutter_otp_text_field: ^1.1.1
  geocoding: 3.0.0
  image_picker: ^1.2.2
  socket_io_client: ^3.1.4
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  google_sign_in: ^6.2.1
  firebase_auth: ^6.5.4
  url_launcher: ^6.3.2
  google_fonts: ^8.2.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Splash Screen
  flutter_native_splash: ^2.4.0

  # App Icon
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/static/
